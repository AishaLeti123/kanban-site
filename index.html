<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Manager - Мои доски</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header>
        <h1>Kanban Manager</h1>
        <nav>
            <ul>
                <li><a href="index.html">Доски</a></li>
                <li><a href="profile.html">Профиль</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>Ваши доски</h2>
            <button class="btn" onclick="createNewBoard()">+ Создать доску</button>
        </div>
        
        <div id="boards-container" class="board-list">
            <!-- Доски будут загружены сюда через JS -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Kanban Manager. Данные хранятся локально.</p>
    </footer>

    <script>
        // Простая логика для index.html
        function loadBoards() {
            const container = document.getElementById('boards-container');
            const boards = JSON.parse(localStorage.getItem('kanban_boards')) || [];
            
            if (boards.length === 0) {
                container.innerHTML = '<p>У вас пока нет досок. Создайте первую!</p>';
                return;
            }

            container.innerHTML = '';
            boards.forEach(board => {
                const link = document.createElement('a');
                link.href = `board.html?id=${board.id}`;
                link.className = 'board-card';
                link.innerHTML = `
                    <h3>${board.title}</h3>
                    <p>Задач: ${board.tasksCount || 0}</p>
                `;
                container.appendChild(link);
            });
        }

        function createNewBoard() {
            const title = prompt("Введите название новой доски:");
            if (title) {
                const boards = JSON.parse(localStorage.getItem('kanban_boards')) || [];
                const newBoard = {
                    id: Date.now().toString(),
                    title: title,
                    tasksCount: 0,
                    columns: [
                        { id: 'col-1', title: 'Нужно сделать', tasks: [] },
                        { id: 'col-2', title: 'В работе', tasks: [] },
                        { id: 'col-3', title: 'Готово', tasks: [] }
                    ]
                };
                boards.push(newBoard);
                localStorage.setItem('kanban_boards', JSON.stringify(boards));
                location.reload();
            }
        }

        window.onload = loadBoards;
    </script>
</body>
</html>
