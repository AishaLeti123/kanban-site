<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Просмотр доски</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header>
        <h1 id="board-title">Загрузка...</h1>
        <nav>
            <ul>
                <li><a href="index.html">← Назад к доскам</a></li>
                <li><a href="profile.html">Профиль</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="kanban-board" class="kanban-board">
            <!-- Колонки генерируются JS -->
        </div>
    </main>

    <footer>
        <p>Перетаскивайте карточки между колонками.</p>
    </footer>

    <script>
        // Получаем ID доски из URL
        const urlParams = new URLSearchParams(window.location.search);
        const boardId = urlParams.get('id');
        
        let currentBoard = null;

        function loadBoard() {
            const boards = JSON.parse(localStorage.getItem('kanban_boards')) || [];
            currentBoard = boards.find(b => b.id === boardId);

            if (!currentBoard) {
                alert("Доска не найдена!");
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('board-title').textContent = currentBoard.title;
            renderBoard();
        }

        function renderBoard() {
            const container = document.getElementById('kanban-board');
            container.innerHTML = '';

            currentBoard.columns.forEach(col => {
                const colDiv = document.createElement('div');
                colDiv.className = 'column';
                colDiv.setAttribute('data-col-id', col.id);

                let tasksHtml = '';
                col.tasks.forEach(task => {
                    tasksHtml += `
                        <div class="task-card" draggable="true" data-task-id="${task.id}">
                            <strong>${task.title}</strong>
                            <div class="task-meta">
                                <span>👤 ${task.assignee || 'Без исп.'}</span>
                                <span>📅 ${task.deadline || ''}</span>
                            </div>
                        </div>
                    `;
                });

                colDiv.innerHTML = `
                    <div class="column-header">
                        <span>${col.title}</span>
                        <span>${col.tasks.length}</span>
                    </div>
                    <div class="task-list" ondrop="drop(event)" ondragover="allowDrop(event)">
                        ${tasksHtml}
                    </div>
                    <button class="btn btn-add" onclick="addTask('${col.id}')">+ Добавить карточку</button>
                `;
                
                // Добавляем слушатели dragstart на карточки после рендера
                container.appendChild(colDiv);
                
                const cards = colDiv.querySelectorAll('.task-card');
                cards.forEach(card => {
                    card.addEventListener('dragstart', drag);
                });
            });
        }

        // --- Drag and Drop Logic ---
        let draggedTaskId = null;
        let sourceColId = null;

        function drag(ev) {
            draggedTaskId = ev.target.getAttribute('data-task-id');
            // Находим колонку-родителя
            sourceColId = ev.target.closest('.column').getAttribute('data-col-id');
            ev.dataTransfer.effectAllowed = "move";
            ev.target.classList.add('dragging');
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drop(ev) {
            ev.preventDefault();
            const targetColDiv = ev.target.closest('.column');
            if (!targetColDiv) return;

            const targetColId = targetColDiv.getAttribute('data-col-id');
            
            // Обновляем данные в памяти
            moveTask(sourceColId, targetColId, draggedTaskId);
            
            // Сохраняем и перерисовываем
            saveBoard();
            renderBoard();
        }

        function moveTask(fromColId, toColId, taskId) {
            const fromCol = currentBoard.columns.find(c => c.id === fromColId);
            const toCol = currentBoard.columns.find(c => c.id === toColId);
            
            const taskIndex = fromCol.tasks.findIndex(t => t.id === taskId);
            if (taskIndex > -1) {
                const [task] = fromCol.tasks.splice(taskIndex, 1);
                toCol.tasks.push(task);
            }
        }

        function addTask(colId) {
            const title = prompt("Название задачи:");
            if (!title) return;
            
            const assignee = prompt("Исполнитель (необязательно):") || "";
            const deadline = prompt("Дедлайн (ДД.ММ.ГГГГ):") || "";

            const col = currentBoard.columns.find(c => c.id === colId);
            col.tasks.push({
                id: 'task-' + Date.now(),
                title: title,
                assignee: assignee,
                deadline: deadline
            });

            saveBoard();
            renderBoard();
        }

        function saveBoard() {
            const boards = JSON.parse(localStorage.getItem('kanban_boards'));
            const index = boards.findIndex(b => b.id === boardId);
            boards[index] = currentBoard;
            localStorage.setItem('kanban_boards', JSON.stringify(boards));
        }

        window.onload = loadBoard;
    </script>
</body>
</html>
